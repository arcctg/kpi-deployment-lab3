name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-go:
    name: lint/go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: app

  lint-dockerfile:
    name: lint/dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  lint-shell:
    name: lint/shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          if compgen -G "deploy/*.sh" > /dev/null; then
            shellcheck deploy/*.sh
          fi

  lint-yaml:
    name: lint/yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint .

  lint-python:
    name: lint/python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v2
        with:
          args: check provision.py

  lint-actions:
    name: lint/actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  test:
    name: test
    runs-on: ubuntu-latest
    needs:
      - lint-go
      - lint-dockerfile
      - lint-shell
      - lint-yaml
      - lint-python
      - lint-actions
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum
      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%",""); print $3}')
          echo "Total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 40) exit 1 }'
      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: coverage-report
          path: |
            app/coverage.out
            app/coverage.html

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:stable,${IMAGE}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: deploy
    runs-on: self-hosted
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      DB_USER: mywebapp
      DB_NAME: mywebapp
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TARGET_SSH_KEY }}" > ~/.ssh/target_key
          chmod 600 ~/.ssh/target_key
          ssh-keyscan -H "${{ secrets.TARGET_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy deploy files
        run: |
          ssh -i ~/.ssh/target_key "${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}" "mkdir -p /tmp/mywebapp-deploy"
          scp -i ~/.ssh/target_key deploy/config.yaml.tmpl deploy/mywebapp.service.tmpl deploy/nginx.conf deploy/sudoers-operator deploy/setup_target.sh "${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}:/tmp/mywebapp-deploy/"
      - name: Run target setup
        run: |
          ssh -i ~/.ssh/target_key "${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}" \
            "sudo env IMAGE_REF='${IMAGE_REF}' DB_USER='${DB_USER}' DB_NAME='${DB_NAME}' DB_PASSWORD='${DB_PASSWORD}' STUDENT_PASSWORD='${STUDENT_PASSWORD}' REPO_DEPLOY='/tmp/mywebapp-deploy' bash /tmp/mywebapp-deploy/setup_target.sh"
      - name: Login and pull image on target
        run: |
          ssh -i ~/.ssh/target_key "${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/target_key "${{ secrets.TARGET_USER }}@${{ secrets.TARGET_HOST }}" \
            "sudo docker pull '${IMAGE_REF}' && sudo systemctl restart mywebapp.service && sudo systemctl reload nginx"

  verify:
    name: verify
    runs-on: self-hosted
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TARGET_SSH_KEY }}" > ~/.ssh/target_key
          chmod 600 ~/.ssh/target_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            IdentityFile ~/.ssh/target_key
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/verify/requirements.txt
      - name: Run testinfra verification
        run: |
          .venv/bin/pytest tests/verify -v --tb=short \
            --hosts=ssh://deploy-target \
            --junitxml=verify-report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.xml
